# Retry, with different settings, the tasks that still lack a usable label.
#
# A plain retry does not need this file: delete the failed trial directories from
# the original job and re-run its config (README.md, "Retrying failures"). Use this
# one only when a setting must change -- e.g. lower n_concurrent_trials -- because
# editing the original config makes its job directory unresumable and reruns every
# task, including the ones that already produced a label.
#
# Build the subset first:
#   ./scripts/make_retry_dataset.py --source datasets/bespoke-stratos-traj-analysis \
#       --labels output/labels --dest datasets/bespoke-stratos-retry --overwrite
#
# Run from the setup_bespoke root (see README.md for the environment variables):
#   uv run --project "$HARBOR_DIR" harbor run --config configs/nrp-retry.yaml
#
# Cluster settings are identical to configs/nrp.yaml.

jobs_dir: jobs
n_attempts: 1
# Fixed job_name for the full-corpus run, which makes the run resumable:
# re-running writes into the same jobs/<job_name>/ directory, and trials that
# already have a result.json are skipped instead of re-executed. The default is a
# timestamp, i.e. every invocation starts from scratch.
#
# Resume requires a BYTE-IDENTICAL config -- Harbor compares the stored
# config.json and raises FileExistsError on any difference. Do not edit this file
# once the run has started; if you must change something, delete
# jobs/bespoke-stratos-6000/ and start over.
job_name: bespoke-stratos-retry
timeout_multiplier: 2.0
# Agent-only override. task.toml sets agent timeout_sec = 1800, so 2.0 would give
# 3600s (60 min); 1.33 gives 2394s (~40 min).
#
# Measured over a 20-trial run: every trial -- including the ones that hung --
# emitted its last event within 27.4 min of its first, and wrote a complete
# labels.json inside that window. Trials that hang go silent and then hold the pod
# for the rest of the cap (33-60 min of dead air, 78% of all pod-time). Raising
# the cap only lengthens the dead air; 40 min keeps ~13 min of headroom over the
# slowest observed run while cutting each hang's waste by a third.
agent_timeout_multiplier: 1.33

# Namespace quota is 200 concurrent pods at 1 CPU / 2Gi.
#
# This number is only real if the agent's max_blocking_threads (below) is raised
# with it. ACKEnvironment._exec runs every in-pod command through
# asyncio.to_thread, which holds one worker thread for the command's full
# duration; the default pool is min(32, cpu_count + 4) = 22 threads on this host.
# Left alone, only ~22 trials execute at a time while the surplus trials still
# hold their pods -- no extra throughput, plus a namespace full of idle requests,
# which is exactly what NRP bans.
#
# 64 of the 200 available pods: it is roughly 3x the unpatched thread ceiling, so
# the thread fix is doing real work, while leaving enough of the shared inference
# endpoint's capacity that queueing should not inflate per-trial latency. The
# 20-trial baseline at concurrency 8 had a 27 min median for non-hung trials --
# if that median climbs sharply here, the endpoint is the limit, not the cluster.
n_concurrent_trials: 32
quiet: false

environment:
  type: ack
  # Images are pre-built and pushed by scripts/build_and_push_images.sh; the
  # in-cluster DinD builder needs a privileged pod, which NRP does not allow.
  force_build: false
  delete: true
  kwargs:
    # --- Edit these three for your NRP account -------------------------------
    context: nautilus
    namespace: wang-research-lab
    registry: gitlab-registry.nrp-nautilus.io/lucas_sjy/harbor_bespoke
    # image_pull_secret: nrp-registry   # only needed for a private registry
    # -------------------------------------------------------------------------
    # Never let ACKEnvironment decide the image is missing. When this is false it
    # calls `docker manifest inspect`, which re-authenticates against NRP GitLab on
    # every call (~23s); under 64-way concurrency almost all of those fail, and a
    # failed check sends ACK down the in-cluster build path. That build Pod has a
    # `builder` container that is privileged and declares no resources, so NRP's
    # Gatekeeper rejects it: `[container-must-have-limits-and-requests] container
    # <builder> does not have <{"cpu","memory"}> requests defined`. A 6000-trial run
    # failed 5506 times that way. The shared image is pushed by
    # scripts/build_and_push_shared_image.sh before the run, so assume it exists.
    skip_image_check: true
    # limits.memory == requests.memory (Guaranteed QoS).
    memory_limit_multiplier: 1.0
    pod_overrides:
      spec:
        # Hard stop for the Pod itself, independent of Harbor's own timeouts.
        activeDeadlineSeconds: 7200
        containers:
            # Every task shares one image holding all trajectories under
            # /trajectories/<task-name>.json (built by --shared-image; per-task
            # images would re-upload the base layer 6000 times, ~183h). This block
            # is identical for every pod -- the per-task part comes from the pod
            # reading its own `environment` label, which ACKEnvironment sets to the
            # task's short name.
            #
            # `cp || exit 1` fails the pod loudly rather than letting the agent see
            # a missing /trajectory.json. `exec sleep infinity` then replaces the
            # shell with the idle process Harbor expects to exec into.
          - env:
              - name: HB_TASK
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['environment']
            command:
              - sh
              - -c
              - >-
                cp "/trajectories/$HB_TASK.json" /trajectory.json
                || { echo "no trajectory for '$HB_TASK'" >&2; exit 1; };
                exec sleep infinity
            securityContext:
              # NRP rejects privileged containers. Root inside the container is
              # still allowed and is what the agent installer expects; Linux
              # capabilities are left at the container-runtime default because
              # apt/dpkg need CHOWN/DAC_OVERRIDE/SETUID/SETGID.
              privileged: false
              runAsUser: 0
            resources:
              # NRP requires limits within 20% of requests; these are exact.
              # requests come from task.toml (cpus/memory_mb/storage_mb).
              limits:
                cpu: "1"
                memory: 2048Mi
                ephemeral-storage: 10240Mi

agents:
  # OpenCode plus an inactivity watchdog. Plain `name: opencode` works too, but it
  # leaves two problems on the table at this scale: hung trials hold their pod
  # until the agent cap (33-60 min of dead air, 78% of pod-time in the 20-trial
  # baseline), and n_concurrent_trials cannot exceed the 22-thread default
  # asyncio pool. Both are addressed by kwargs below.
  #
  # Requires the adapter package on the import path, so harbor must run with
  # PYTHONPATH=src from the setup_bespoke root (see README.md).
  - import_path: bespoke_stratos_traj_analysis.opencode_watchdog:OpenCodeIdleWatchdog
    # Custom provider id: opencode routes the built-in "openai" id through the
    # Responses API (/v1/responses), which the NRP gateway rejects whenever an
    # assistant turn mixes text with a tool call. A non-"openai" id with the
    # openai-compatible SDK uses /v1/chat/completions instead.
    model_name: nrp/qwen3-small
    # Agent-level env is resolved from the host shell before being injected into
    # the pod exec environment, so it works the same on Kubernetes as on Docker.
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    kwargs:
      # Kill OpenCode after this long with no new output. Normal event gaps are
      # far shorter; a hang is permanent silence, so 10 min separates them with
      # room to spare for one slow request.
      idle_timeout_sec: 600
      # Must exceed n_concurrent_trials -- pod create/get/delete share this pool
      # with the long-lived exec calls. 128 for 64 trials leaves 64 spare.
      max_blocking_threads: 128
      opencode_config:
        provider:
          nrp:
            npm: "@ai-sdk/openai-compatible"
            name: NRP
            options:
              baseURL: "{env:OPENAI_BASE_URL}"
              apiKey: "{env:OPENAI_API_KEY}"
            models:
              # Key MUST match the model id after "nrp/" (model_name is
              # nrp/qwen3-small), otherwise the contextLength is ignored and
              # opencode falls back to its default window.
              qwen3-small:
                contextLength: 131072
                options:
                  max_tokens: 65536

artifacts:
  - /output/labels.json

datasets:
  - path: datasets/bespoke-stratos-retry
